name: release

# Fires when a release tag is pushed to master. Use scripts/release.mjs locally
# to produce the four-file version bump + tag; this workflow takes it from
# there: re-run the full test matrix, build, then publish to npm via Trusted
# Publisher (OIDC, no NPM_TOKEN secret) and create a GitHub Release.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Skip on forks: npm Trusted Publisher is bound to hacker-cb/markdown-docs-mcp,
    # so a fork's tag push would burn CI minutes only to fail at `npm publish`.
    if: github.repository_owner == 'hacker-cb'
    name: publish to npm + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # softprops/action-gh-release writes the release
      id-token: write   # npm OIDC for Trusted Publisher
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to >= 11.5.1 (required for Trusted Publisher / OIDC)
        # npm Trusted Publishing (OIDC) requires npm >= 11.5.1. Node 20 LTS
        # ships with npm 10.x, which falls back to legacy auth and fails on
        # `npm publish --provenance` (returns 404 from the registry because
        # the OIDC handshake never happens).
        #
        # In-place self-upgrade (`npm i -g npm@latest`, even with `--force`)
        # blows up with MODULE_NOT_FOUND because the old client unlinks
        # bundled deps that its own rebuild step still requires. Install the
        # new client into a separate prefix instead and prepend it to PATH
        # via $GITHUB_PATH — the system npm stays untouched.
        run: |
          NPM_PREFIX="$RUNNER_TEMP/npm-latest"
          mkdir -p "$NPM_PREFIX"
          npm install --prefix "$NPM_PREFIX" npm@latest
          echo "$NPM_PREFIX/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Confirm npm version
        run: npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches the four-file version invariant
        # Defends against pushing a `v*` tag from a commit where scripts/release.mjs
        # wasn't run (or was run with a different version). Without this guard,
        # `npm publish` would happily ship whatever version package.json contains
        # under a tag/release name that doesn't match.
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: ${GITHUB_REF_NAME} → expected version ${TAG_VERSION}"
          node -e '
            const fs = require("fs");
            const expected = process.argv[1];
            const sources = {
              "package.json": JSON.parse(fs.readFileSync("package.json", "utf8")).version,
              ".claude-plugin/plugin.json": JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8")).version,
              ".claude-plugin/marketplace.json": JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8")).plugins[0].version,
              ".mcp.json": (JSON.parse(fs.readFileSync(".mcp.json", "utf8")).mcpServers["markdown-docs"].args.find(a => typeof a === "string" && a.startsWith("markdown-docs-mcp@")) || "").split("@")[1],
            };
            const bad = Object.entries(sources).filter(([, v]) => v !== expected);
            if (bad.length > 0) {
              console.error(`Tag ${process.argv[1]} does not match all version sources:`);
              for (const [f, v] of Object.entries(sources)) console.error(`  ${f}: ${v}`);
              process.exit(1);
            }
            console.log(`All four files agree on version ${expected}.`);
          ' "${TAG_VERSION}"

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish to npm (OIDC / Trusted Publisher)
        # --provenance signs the publish with the GitHub workflow's identity,
        # which npmjs.com shows as a verified provenance badge.
        # Trusted Publisher must be configured on npmjs.com (Account → Trusted
        # Publishers → add this repo + workflow file) before the first publish.
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
