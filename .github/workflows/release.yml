name: release

# Fires on any pushed `v*` release tag (the trigger does not constrain the
# branch — by convention tags are cut on master via scripts/release.mjs, which
# produces the version bump + tag). This workflow takes it from there:
# re-run the full test matrix, build, then publish to npm via Trusted
# Publisher (OIDC, no NPM_TOKEN secret) and create a GitHub Release.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Skip on forks: npm Trusted Publisher is bound to hacker-cb/markdown-docs-mcp,
    # so a fork's tag push would burn CI minutes only to fail at `npm publish`.
    if: github.repository_owner == 'hacker-cb'
    name: publish to npm + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # softprops/action-gh-release writes the release
      id-token: write   # npm OIDC for Trusted Publisher
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm to >= 11.5.1 (required for Trusted Publisher / OIDC)
        # npm Trusted Publishing (OIDC) requires npm >= 11.5.1. Node 20 LTS
        # ships with npm 10.x, which falls back to legacy auth and fails on
        # `npm publish --provenance` (returns 404 from the registry because
        # the OIDC handshake never happens).
        #
        # In-place self-upgrade (`npm i -g npm@latest`, even with `--force`)
        # blows up with MODULE_NOT_FOUND because the old client unlinks
        # bundled deps that its own rebuild step still requires. Install the
        # new client into a separate prefix instead and prepend it to PATH
        # via $GITHUB_PATH — the system npm stays untouched.
        run: |
          NPM_PREFIX="$RUNNER_TEMP/npm-latest"
          mkdir -p "$NPM_PREFIX"
          npm install --prefix "$NPM_PREFIX" npm@latest
          echo "$NPM_PREFIX/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Confirm npm version
        run: npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        # Defends against pushing a `v*` tag from a commit where scripts/release.mjs
        # wasn't run (or was run with a different version). Without this guard,
        # `npm publish` would happily ship whatever version package.json contains
        # under a tag/release name that doesn't match.
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag: ${GITHUB_REF_NAME} → expected ${TAG_VERSION}; package.json: ${PKG_VERSION}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "package.json agrees on version ${TAG_VERSION}."

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish to npm (OIDC / Trusted Publisher)
        # --provenance signs the publish with the GitHub workflow's identity,
        # which npmjs.com shows as a verified provenance badge.
        # Trusted Publisher must be configured on npmjs.com (Account → Trusted
        # Publishers → add this repo + workflow file) before the first publish.
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
